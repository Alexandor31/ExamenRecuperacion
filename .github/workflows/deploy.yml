name: Deploy to Fly.io

# Trigger on every push to main. The workflow:
# 1. Installs the fly CLI on the runner.
# 2. Authenticates with the FLY_API_TOKEN secret.
# 3. Runs `fly deploy` against the examenrecuperacion app.

on:
  push:
    branches: [main]
  workflow_dispatch:        # allow manual triggers from the GitHub UI

concurrency:
  group: fly-deploy
  cancel-in-progress: false  # never cancel a deploy in flight

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          fly deploy --remote-only --strategy immediate --app examenrecuperacion

      - name: Smoke test
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Esperando 30 s para que arranque la VM…"
          sleep 30
          for i in 1 2 3 4 5; do
            echo "--- Intento $i ---"
            if curl -fsS --max-time 15 https://examenrecuperacion.fly.dev/health; then
              echo "✓ Servicio OK"
              exit 0
            fi
            sleep 15
          done
          echo "✗ Servicio no responde tras 5 intentos"
          fly logs --app examenrecuperacion
          exit 1
